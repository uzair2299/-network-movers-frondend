server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    # Redirect root to the app base path
    location = / {
        return 302 /network-movers-portal/;
    }

    # Serve the Angular SPA at /network-movers-portal/
    location /network-movers-portal/ {
        index index.html;
        # SPA fallback: all unmatched routes return index.html for Angular router
        try_files $uri $uri/ /network-movers-portal/index.html?$args;
    }

    # Serve assets using alias to avoid path doubling issues
    location /network-movers-portal/assets/ {
        alias /usr/share/nginx/html/network-movers-portal/assets/;
        expires 1d;
        add_header Cache-Control public;
    }

    # Health check endpoint
    location /healthz {
        return 200;
    }
}
