server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    # Serve the Angular SPA at root
    location / {
        index index.html;
        # SPA fallback: all unmatched routes return index.html for Angular router
        try_files $uri $uri/ /index.html?$args;
    }

    # Serve assets
    location /assets/ {
        alias /usr/share/nginx/html/assets/;
        expires 1d;
        add_header Cache-Control public;
    }

    # Health check endpoint
    location /healthz {
        return 200;
    }
}
