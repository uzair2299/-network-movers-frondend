<div class="dialog-container">
  <div class="dialog-header">
    <h2>{{ dialogTitle }}</h2>
    <button (click)="onCancel()" class="close-button">
      <span>✕</span>
    </button>
  </div>

  <div class="dialog-content">
    <!-- Error Message -->
    <div *ngIf="error" class="alert alert-danger">
      {{ error }}
    </div>

    <form [formGroup]="form" class="form-grid">
      <!-- Name Field -->
      <div class="form-group">
        <label for="name">Name *</label>
        <input
          id="name"
          type="text"
          formControlName="name"
          placeholder="e.g., Dashboard, Settings, Users"
          class="form-control">
        <div *ngIf="nameError" class="form-error">{{ nameError }}</div>
      </div>

      <!-- Icon Field -->
      <div class="form-group">
        <label for="icon">Icon</label>
        <input
          id="icon"
          type="text"
          formControlName="icon"
          placeholder="Enter icon name or SVG path"
          class="form-control">
      </div>

      <!-- Path Field -->
      <div class="form-group">
        <label for="path">Path</label>
        <input
          id="path"
          type="text"
          formControlName="path"
          placeholder="e.g., /dashboard, /settings"
          class="form-control">
      </div>

      <!-- Section Field -->
      <div class="form-group custom-dropdown-container">
        <label>Section *</label>
        <div class="custom-select-trigger" 
             [class.open]="isSectionDropdownOpen"
             (click)="toggleSectionDropdown()">
          <span>{{ getSectionLabel(form.get('section')?.value) }}</span>
          <svg class="caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </div>
        
        <div class="custom-options-menu" *ngIf="isSectionDropdownOpen">
          <div class="custom-option" 
               *ngFor="let section of sections" 
               [class.selected]="form.get('section')?.value === section.value"
               (click)="selectSection(section.value)">
            {{ section.label }}
          </div>
        </div>
      </div>

      <!-- Sort Order Field -->
      <div class="form-group">
        <label for="sortOrder">Sort Order *</label>
        <input
          id="sortOrder"
          type="number"
          formControlName="sortOrder"
          min="0"
          class="form-control">
        <div *ngIf="sortOrderError" class="form-error">{{ sortOrderError }}</div>
      </div>

      <!-- Parent ID Field -->
      <div class="form-group">
        <label for="parentId">Parent ID</label>
        <input 
          type="number" 
          id="parentId" 
          formControlName="parentId"
          class="form-control"
          placeholder="e.g. 11">
      </div>

      <!-- Permission ID Field -->
      <div class="form-group">
        <label for="permissionId">Permission ID</label>
        <input 
          type="number" 
          id="permissionId" 
          formControlName="permissionId"
          class="form-control"
          placeholder="e.g. 5">
      </div>

      <!-- Active Checkbox -->
      <div class="form-group checkbox-group full-width">
        <label>
          <input
            type="checkbox"
            formControlName="active">
          <span>Active</span>
        </label>
        <small>Inactive items will be hidden from the menu</small>
      </div>
    </form>
  </div>

  <div class="dialog-actions">
    <button
      type="button"
      (click)="onCancel()"
      class="btn-cancel">
      Cancel
    </button>
    <button
      type="button"
      (click)="onSubmit()"
      [disabled]="!form.valid || isSubmitting"
      class="btn-submit">
      <span *ngIf="!isSubmitting">{{ isEditMode ? 'Update' : 'Create' }}</span>
      <span *ngIf="isSubmitting">Saving...</span>
    </button>
  </div>
</div>
