<div class="dialog-container">
  <div class="dialog-header">
    <h2>{{ dialogTitle }}</h2>
    <button (click)="onCancel()" class="close-button">
      <span>✕</span>
    </button>
  </div>

  <div class="dialog-content">
    <!-- Error Message -->
    <div *ngIf="error" class="alert alert-danger">
      {{ error }}
    </div>

    <form [formGroup]="form" class="form-grid">
      <!-- Name Field -->
      <app-form-input
        label="Name *"
        placeholder="e.g., Dashboard, Settings, Users"
        [control]="$any(form.get('name'))">
      </app-form-input>

      <!-- Icon Field -->
      <app-form-input
        label="Icon"
        placeholder="Enter icon name or SVG path"
        [control]="$any(form.get('icon'))">
      </app-form-input>

      <!-- Path Field -->
      <app-form-input
        label="Path"
        placeholder="e.g., /dashboard, /settings"
        [control]="$any(form.get('path'))">
      </app-form-input>

      <!-- Section Field -->
      <app-form-select
        label="Section *"
        [options]="sections"
        [control]="$any(form.get('section'))">
      </app-form-select>

      <!-- Sort Order Field -->
      <app-form-input
        label="Sort Order *"
        type="number"
        [min]="0"
        [control]="$any(form.get('sortOrder'))">
      </app-form-input>

      <!-- Parent ID Field -->
      <app-form-input
        label="Parent ID"
        type="number"
        placeholder="e.g. 11"
        [control]="$any(form.get('parentId'))">
      </app-form-input>

      <!-- Permission ID Field -->
      <app-form-input
        label="Permission ID"
        type="number"
        placeholder="e.g. 5"
        [control]="$any(form.get('permissionId'))">
      </app-form-input>

      <!-- Active Checkbox -->
      <div class="form-group checkbox-group full-width">
        <label>
          <input
            type="checkbox"
            formControlName="active">
          <span>Active</span>
        </label>
        <small>Inactive items will be hidden from the menu</small>
      </div>
    </form>
  </div>

  <div class="dialog-actions">
    <button
      type="button"
      (click)="onCancel()"
      class="btn-cancel">
      Cancel
    </button>
    <button
      type="button"
      (click)="onSubmit()"
      [disabled]="!form.valid || isSubmitting"
      class="btn-submit">
      <span *ngIf="!isSubmitting">{{ isEditMode ? 'Update' : 'Create' }}</span>
      <span *ngIf="isSubmitting">Saving...</span>
    </button>
  </div>
</div>
