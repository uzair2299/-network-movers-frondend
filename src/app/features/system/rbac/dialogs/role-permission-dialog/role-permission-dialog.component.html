<div class="dialog-header">
  <h2 mat-dialog-title>Assign Permission to Role</h2>
  <button class="close-btn" (click)="onCancel()">
    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
  </button>
</div>

<div mat-dialog-content class="dialog-content-body">
  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="modern-form">

    <div class="form-group full-width">
      <app-form-select
        label="Role"
        placeholder="Select a role"
        [required]="true"
        [options]="roleOptions"
        [control]="$any(form.get('roleId'))">
      </app-form-select>
    </div>

    <div class="form-group full-width">
      <app-form-select
        label="Permission"
        placeholder="Select a permission"
        [required]="true"
        [options]="permissionOptions"
        [control]="$any(form.get('permissionId'))">
      </app-form-select>
    </div>

  </form>
</div>

<div mat-dialog-actions class="dialog-actions">
  <app-button variant="outline" (btnClick)="onCancel()">Cancel</app-button>
  <app-button variant="primary" (btnClick)="onSubmit()">Assign Permission</app-button>
</div>
