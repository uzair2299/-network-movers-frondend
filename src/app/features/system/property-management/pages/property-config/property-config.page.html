<div class="page-container">
  <app-page-header
    title="Property Configuration"
    description="Manage core property lookup tables and configurations">
  </app-page-header>

  <div class="modern-list-card config-layout">
    <!-- Side Nav -->
    <div class="side-nav">
      <div class="nav-section-title">Lookup Tables</div>
      <app-divider margin="0 0 1rem 0"></app-divider>
      <ul class="nav-list">
        <li [class.active]="activeTab === 'categories'" (click)="setTab('categories')">Property Categories</li>
        <li [class.active]="activeTab === 'types'" (click)="setTab('types')">Property Types</li>
        <li [class.active]="activeTab === 'sizes'" (click)="setTab('sizes')">Property Sizes</li>
        <li [class.active]="activeTab === 'floor'" (click)="setTab('floor')">Floor Types</li>
        <li [class.active]="activeTab === 'building'" (click)="setTab('building')">Building Access</li>
        <li [class.active]="activeTab === 'parking'" (click)="setTab('parking')">Parking Access</li>
        <li [class.active]="activeTab === 'restrictions'" (click)="setTab('restrictions')">Access Restrictions</li>
      </ul>
    </div>

    <!-- Main Content -->
    <div class="main-content">
      <div class="content-header">
        <h2>{{ getTabTitle() }}</h2>
        <div class="header-actions">
          <app-search-bar 
            placeholder="Search {{ getTabTitle() }}..." 
            [(value)]="searchQuery">
          </app-search-bar>
          <app-button variant="primary" (btnClick)="openCreateDialog()">Add New</app-button>
        </div>
      </div>
      <app-divider margin="0 0 1.5rem 0"></app-divider>

      <app-dynamic-table
        [columns]="tableColumns"
        [data]="getFilteredAndSortedData()"
        [sortColumn]="sortColumn"
        [sortDirection]="sortDirection"
        [isLoading]="isLoading"
        [emptyTitle]="'No ' + getTabTitle() + ' Found'"
        [emptyMessage]="searchQuery ? 'No results match your search for \'' + searchQuery + '\'.' : 'Click \'Add New\' to create your first entry.'"
        (sort)="toggleSort($event)"
        (action)="handleTableAction($event)">
      </app-dynamic-table>
    </div>
  </div>
</div>
