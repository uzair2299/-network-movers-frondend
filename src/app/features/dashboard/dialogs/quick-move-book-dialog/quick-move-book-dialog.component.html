<div class="dialog-container">
  <div class="dialog-header">
    <h2>Quick Move Book</h2>
    <button (click)="onCancel()" class="close-button">
      <span>✕</span>
    </button>
  </div>

  <div class="dialog-content">
    <div class="map-layout">
      <div class="booking-form">
        <form [formGroup]="form" class="form-grid">
          <div class="form-group full-width">
            <label>Client Name</label>
            <input type="text" formControlName="clientName" class="form-control" placeholder="e.g. John Doe">
          </div>
          
          <div class="form-group full-width">
            <label>Pickup Location</label>
            <input type="text" #pickupInput formControlName="pickup" class="form-control" placeholder="Search pickup address...">
          </div>
          
          <div class="form-group full-width">
            <label>Dropoff Location</label>
            <input type="text" #dropoffInput formControlName="dropoff" class="form-control" placeholder="Search dropoff address...">
          </div>
          
          <div class="form-group">
            <label>Move Date</label>
            <input type="date" formControlName="moveDate" class="form-control">
          </div>
          
          <div class="form-group full-width">
            <label>Property Size</label>
            <select formControlName="size" class="form-control">
              <option value="">Select Size</option>
              <option value="Studio">Studio</option>
              <option value="1BR">1 Bedroom</option>
              <option value="2BR">2 Bedrooms</option>
              <option value="3BR+">3+ Bedrooms</option>
              <option value="Office">Office</option>
            </select>
          </div>
          
          <div class="form-group full-width" *ngIf="distanceText">
            <div class="alert" style="background-color: rgba(245, 166, 35, 0.1); border-left: 4px solid #f5a623; color: #f5a623;">
              <strong>Estimated Distance:</strong> {{ distanceText }} ({{ durationText }})
            </div>
          </div>
        </form>
      </div>
      
      <div class="map-container">
        <div #mapElement class="google-map"></div>
      </div>
    </div>
  </div>

  <div class="dialog-actions">
    <button class="btn-cancel" (click)="onCancel()">Cancel</button>
    <button class="btn-submit" [disabled]="form.invalid || isSubmitting" (click)="onSubmit()">
      {{ isSubmitting ? 'Booking...' : 'Book Move' }}
    </button>
  </div>
</div>
