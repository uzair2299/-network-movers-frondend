<div class="login-wrapper">
  <div class="login-left">
    <div class="brand-container">
      <div class="brand">
        
        <span>Network Movers</span>
      </div>
    </div>
    
    <div class="welcome-text">
      <h1>Admin Control Panel</h1>
      <p>Sign in to manage users, configurations, and system operations.</p>
    </div>
  </div>

  <div class="login-right">
    <div class="login-card">
      <div class="card-header">
        <h1>Welcome Back</h1>
      </div>

      <form (ngSubmit)="login()">
        <div class="form-group">
          <input id="username" name="username" placeholder="Username" [(ngModel)]="username" required />
        </div>

        <div class="form-group">
          <input id="password" type="password" placeholder="Password" name="password" [(ngModel)]="password" required />
        </div>

        <div class="forgot-password">
          <a href="#">Forgot Password?</a>
        </div>

        <div class="actions">
          <button type="submit" [disabled]="loading">{{ loading ? 'Logging in...' : 'Login' }}</button>
        </div>
        

        <div class="error-message" *ngIf="error">{{ error }}</div>
      </form>
    </div>
  </div>
</div>
