<div class="page-container">
  <app-page-header 
    title="Vehicle Categories" 
    description="Manage fleet vehicle classifications">
  </app-page-header>

  <div *ngIf="error" class="alert alert-danger">
    {{ error }}
  </div>

  <app-loading-spinner *ngIf="isLoading" message="Loading vehicle types..."></app-loading-spinner>

  <div class="modern-list-card" *ngIf="!isLoading || vehicleTypes.length > 0">
    <!-- Actions Bar -->
    <div class="actions-bar">
      <div class="spacer"></div>
      
      <div class="actions-right">
        <app-button 
          variant="primary"
          (btnClick)="createNewVehicleType()">
          <span class="icon">+</span> Add Vehicle Type
        </app-button>

        <app-dropdown-menu
          label="More Actions"
          [items]="moreActions"
          (itemSelected)="handleMoreAction($event)">
        </app-dropdown-menu>  
      </div>
    </div>

    <div class="toolbar-divider"></div>

    <div class="tabs-and-search-row">
      <div class="section-tabs">
        <!-- Add tabs here if needed later -->
      </div>

      <app-search-bar 
        placeholder="Search vehicle types..." 
        [value]="searchQuery"
        (valueChange)="onSearch($event)">
      </app-search-bar>
    </div>

    <div class="table-container">
      <table class="modern-table">
        <thead>
          <tr>
            <th>Name</th>
            <th>Code</th>
            <th>Description</th>
            <th>Status</th>
            <th class="actions-th"></th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let vehicle of vehicleTypes">
            <td>
              <div class="font-medium text-white">{{ vehicle.name }}</div>
            </td>
            <td><span class="text-muted">{{ vehicle.code }}</span></td>
            <td>
              <span class="text-muted" style="font-size: 0.85em;">{{ vehicle.description }}</span>
            </td>
            <td>
              <app-status-badge [status]="vehicle.active"></app-status-badge>
            </td>
            <td class="actions-cell">
              <app-dropdown-menu
                [items]="vehicleActions"
                [iconOnly]="true"
                (itemSelected)="handleVehicleAction($event, vehicle)">
              </app-dropdown-menu>
            </td>
          </tr>
          
          <!-- Empty state -->
          <tr *ngIf="vehicleTypes.length === 0 && !isLoading">
            <td colspan="5" class="text-center py-5">
              <div class="empty-state">
                <p>No vehicle types found.</p>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Pagination -->
    <div class="pagination-wrapper" *ngIf="totalElements > 0">
      <app-pagination
        [totalElements]="totalElements"
        [pageSize]="pageSize"
        [currentPage]="currentPage"
        (pageChange)="onPageChange($event)"
        (sizeChange)="onSizeChange($event)">
      </app-pagination>
    </div>
  </div>
</div>
