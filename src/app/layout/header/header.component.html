<header class="app-header">
  <div class="header-left">
    <button class="icon-btn mobile-menu-toggle" (click)="layoutService.toggleMobileSidebar()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
      </svg>
    </button>
    <div class="search-bar">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
      </svg>
      <input type="text" placeholder="Search..." />
    </div>
  </div>
  
  <div class="header-right">
    <app-theme-switcher></app-theme-switcher>
    <button class="icon-btn" title="Notifications">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
      </svg>
      <span class="notification-dot"></span>
    </button>
    
    <!-- Profile Dropdown -->
    <div class="profile-wrapper" [class.open]="isProfileOpen">
      <button class="profile-trigger" (click)="toggleProfileDropdown()" id="profile-dropdown-trigger">
        <div class="profile-avatar">
          <span class="avatar-initials">{{ getUserInitials() }}</span>
        </div>
        <div class="profile-info">
          <span class="profile-name">{{ userName || 'User' }}</span>
          <span class="profile-email">{{ userEmail || '' }}</span>
        </div>
        <svg class="chevron-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
        </svg>
      </button>

      <div class="profile-dropdown" *ngIf="isProfileOpen" id="profile-dropdown-menu">
        <!-- User info header -->
        <div class="dropdown-header">
          <div class="dropdown-avatar">
            <span class="avatar-initials large">{{ getUserInitials() }}</span>
          </div>
          <div class="dropdown-user-info">
            <span class="dropdown-name">{{ userName || 'User' }}</span>
            <span class="dropdown-email">{{ userEmail || '' }}</span>
          </div>
        </div>

        <div class="dropdown-divider"></div>

        <!-- Dynamic profile menu items from API -->
        <ng-container *ngIf="profileMenuItems.length > 0">
          <button
            *ngFor="let item of profileMenuItems"
            class="dropdown-item"
            (click)="navigateTo(item.path)"
            [id]="'profile-menu-item-' + item.id">
            <span class="dropdown-item-icon" *ngIf="item.icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" *ngIf="isSvgIcon(item.icon); else textIcon">
                <path stroke-linecap="round" stroke-linejoin="round" [attr.d]="item.icon" />
              </svg>
              <ng-template #textIcon>
                <span class="icon-text">{{ item.icon }}</span>
              </ng-template>
            </span>
            <span class="dropdown-item-label">{{ item.name }}</span>
          </button>
          <div class="dropdown-divider"></div>
        </ng-container>

        <!-- Fallback static items if no API items -->
        <ng-container *ngIf="profileMenuItems.length === 0">
          <button class="dropdown-item" (click)="navigateTo('/profile')" id="profile-menu-item-profile">
            <span class="dropdown-item-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
              </svg>
            </span>
            <span class="dropdown-item-label">My Profile</span>
          </button>
          <button class="dropdown-item" (click)="navigateTo('/settings')" id="profile-menu-item-settings">
            <span class="dropdown-item-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              </svg>
            </span>
            <span class="dropdown-item-label">Settings</span>
          </button>
          <div class="dropdown-divider"></div>
        </ng-container>

        <!-- Logout -->
        <button class="dropdown-item logout-item" (click)="logout()" id="profile-menu-item-logout">
          <span class="dropdown-item-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
            </svg>
          </span>
          <span class="dropdown-item-label">Logout</span>
        </button>
      </div>
    </div>
  </div>
</header>
