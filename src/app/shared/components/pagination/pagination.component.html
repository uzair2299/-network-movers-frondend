<div class="pagination-container" *ngIf="totalElements > 0">
  <div class="pagination-info">
    Showing 
    <strong>{{ (currentPage * pageSize) + 1 }}</strong> 
    to 
    <strong>{{ min((currentPage * pageSize) + pageSize, totalElements) }}</strong> 
    of 
    <strong>{{ totalElements }}</strong> entries
  </div>
  
  <div class="pagination-controls">
    <div class="custom-dropdown-container">
      <div 
        class="custom-select-trigger" 
        [class.open]="isPageSizeOpen"
        (click)="togglePageSize()">
        <span>{{ pageSize }} / page</span>
        <svg class="caret" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
      </div>
      
      <div class="custom-options-menu" *ngIf="isPageSizeOpen">
        <div class="custom-option" [class.selected]="pageSize === 10" (click)="setPageSize(10)">10 / page</div>
        <div class="custom-option" [class.selected]="pageSize === 20" (click)="setPageSize(20)">20 / page</div>
        <div class="custom-option" [class.selected]="pageSize === 50" (click)="setPageSize(50)">50 / page</div>
        <div class="custom-option" [class.selected]="pageSize === 100" (click)="setPageSize(100)">100 / page</div>
      </div>
    </div>
    
    <ul class="pagination">
      <li class="page-item" [class.disabled]="currentPage === 0">
        <button class="page-link" (click)="goToPage(currentPage - 1)" [disabled]="currentPage === 0">
          &laquo;
        </button>
      </li>
      
      <li class="page-item" *ngIf="pages.length > 0 && pages[0] > 0">
        <button class="page-link" (click)="goToPage(0)">1</button>
      </li>
      
      <li class="page-item disabled" *ngIf="pages.length > 0 && pages[0] > 1">
        <span class="page-link">...</span>
      </li>
      
      <li class="page-item" *ngFor="let page of pages" [class.active]="page === currentPage">
        <button class="page-link" (click)="goToPage(page)">
          {{ page + 1 }}
        </button>
      </li>
      
      <li class="page-item disabled" *ngIf="pages.length > 0 && pages[pages.length - 1] < totalPages - 2">
        <span class="page-link">...</span>
      </li>
      
      <li class="page-item" *ngIf="pages.length > 0 && pages[pages.length - 1] < totalPages - 1">
        <button class="page-link" (click)="goToPage(totalPages - 1)">{{ totalPages }}</button>
      </li>
      
      <li class="page-item" [class.disabled]="currentPage === totalPages - 1 || totalPages === 0">
        <button class="page-link" (click)="goToPage(currentPage + 1)" [disabled]="currentPage === totalPages - 1 || totalPages === 0">
          &raquo;
        </button>
      </li>
    </ul>
  </div>
</div>
