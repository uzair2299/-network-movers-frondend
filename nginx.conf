server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    location = / {
        return 302 /network-movers-portal/;
    }

    location /network-movers-portal/ {
        index index.html;
        # Standard SPA fallback for Angular router
        try_files $uri $uri/ /network-movers-portal/index.html?$args;
    }

    # Better handling of assets using alias to avoid path doubling issues
    location /network-movers-portal/assets/ {
        alias /usr/share/nginx/html/network-movers-portal/assets/;
        expires 1d;
        add_header Cache-Control public;
    }

    location /healthz {
        return 200;
    }
}
